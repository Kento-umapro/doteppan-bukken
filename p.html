<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物件詳細｜どてっぱん 出店物件情報</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--ink:#17130f;--paper:#f3ede1;--card:#fbf7ee;--line:#e0d5c0;--sub:#6f6553;--red:#c2352a;--gold:#8a6d2f}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px}
.brand{font-weight:800;letter-spacing:.04em;color:var(--sub);font-size:13px;margin-bottom:6px}
a.home{color:var(--sub);text-decoration:none;font-size:13px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:12px}
h1{font-size:20px;margin:0 0 12px;line-height:1.4}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.bg{font-size:12px;font-weight:800;border-radius:999px;padding:4px 11px;border:1px solid var(--line);background:#fff;color:var(--sub)}
.bg.pmA{background:#1f7a3d;border-color:#1f7a3d;color:#fff}.bg.pmB{background:#7a6a4f;color:#fff;border-color:#7a6a4f}.bg.pmC{background:#a5372c;color:#fff;border-color:#a5372c}
.bg.ok{background:#eef3ee;border-color:#5a7a5a;color:#2f4a2f}
.bg.sc{background:var(--ink);color:#f5efe3;border-color:var(--ink)}
dl{display:grid;grid-template-columns:88px 1fr;gap:8px 12px;margin:0}
dt{color:var(--sub);font-weight:700;font-size:13px}
dd{margin:0;font-size:15px}
dd.rent b,.pmv{color:var(--red)}
#map{height:300px;border-radius:12px;margin-top:14px;border:1px solid var(--line)}
.gate{position:fixed;inset:0;background:rgba(23,19,15,.9);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.gate.on{display:flex}
.gbox{background:#fff;border-radius:16px;padding:24px;max-width:340px;width:100%;text-align:center}
.gbox input{width:100%;padding:12px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;margin:12px 0}
.gbox button{width:100%;padding:12px;font-size:15px;font-weight:800;background:var(--ink);color:#f5efe3;border:0;border-radius:10px;cursor:pointer}
.err{color:var(--red);font-size:13px;min-height:18px}
.miss{text-align:center;color:var(--sub);padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">どてっぱん 出店物件情報</div>
  <a class="home" href="./">← 物件一覧トップへ</a>
  <div id="out"></div>
</div>

<div class="gate" id="gate"><div class="gbox">
  <b>本部発行のパスワード</b>
  <input id="pw" type="password" placeholder="パスワード" autocomplete="off">
  <div class="err" id="pwErr"></div>
  <button id="pwGo">表示する</button>
</div></div>

<script>
const PASS="monja";
const $=s=>document.querySelector(s);
const FLOOR={f1:"1階 路面",f2:"2階",b1:"地下1階",f3:"3階以上"};
const code=new URLSearchParams(location.search).get('code')||'';
let ITEM=null;

function esc(t){const d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML;}

async function findItem(){
  const r=await fetch('data.json?nc='+Date.now(),{cache:'no-store'});
  const j=await r.json();
  for(const tier of ['prefs','premium'])
    for(const p in (j[tier]||{}))
      for(const x of j[tier][p].items)
        if(x.cd===code) return x;
  return null;
}

function render(){
  const x=ITEM;
  if(!x){ $('#out').innerHTML='<div class="card miss"><b>指定の物件が見つかりませんでした</b><p>掲載が終了した可能性があります。<a href="./">物件一覧トップ</a>からお探しください。</p></div>'; return; }
  const pmc=x.pm>=10?'pmA':x.pm>=7?'pmB':'pmC';
  $('#out').innerHTML=`<div class="card">
    <h1>${esc(x.n)}</h1>
    <div class="badges">
      ${x.sc?`<span class="bg sc">出店偏差値 ${x.sc}（ランク${esc(x.rk)}）</span>`:''}
      ${x.pm?`<span class="bg ${pmc}">予測 家賃${x.pm}倍${x.pm>=10?'・狙い目':''}</span>`:''}
      <span class="bg">${esc(FLOOR[x.s]||'')}</span>
      <span class="bg ok">重飲食可</span>
    </div>
    <dl>
      ${x.pm?`<dt>予測収益</dt><dd><b class="pmv">月商 約${x.prv}万円 ＝ 家賃の${x.pm}倍</b></dd>`:''}
      <dt>賃料</dt><dd class="rent"><b>${esc(x.r)}</b> <small>${esc(x.rs||'')}</small></dd>
      <dt>広さ</dt><dd>${esc(x.t)}${x.tk?`　坪単価 ${esc(x.tk)}`:''}</dd>
      <dt>階数</dt><dd><b>${esc(FLOOR[x.s]||'')}</b></dd>
      <dt>所在地</dt><dd>${esc(x.a)}${x.st?`（${esc(x.st)}）`:''}</dd>
      <dt>敷金等</dt><dd>${esc(x.d||'要問い合わせ')}</dd>
      ${x.fn?`<dt>備考</dt><dd>${esc(x.fn)}</dd>`:''}
      <dt>問合せ</dt><dd>本部 出店開発まで（社内メール取得物件）</dd>
    </dl>
    ${x.ll?'<div id="map"></div>':''}
  </div>`;
  if(x.ll&&typeof L!=='undefined'){
    const m=L.map('map',{scrollWheelZoom:false}).setView(x.ll,16);
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,attribution:'地理院タイル'}).addTo(m);
    L.marker(x.ll).addTo(m);
    setTimeout(()=>m.invalidateSize(),120);
  }
}

async function start(){ ITEM=await findItem(); render(); }

function tryPass(){
  if($('#pw').value===PASS){ localStorage.setItem('dp_auth','1'); $('#gate').classList.remove('on'); start(); }
  else { $('#pwErr').textContent='パスワードが違います。'; $('#pw').select(); }
}
$('#pwGo').addEventListener('click',tryPass);
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryPass();});

if(localStorage.getItem('dp_auth')==='1'){ start(); }
else { $('#gate').classList.add('on'); setTimeout(()=>$('#pw').focus(),50); }
</script>
</body>
</html>
